# scripts/check.conf — LeaveManager (Python 3.12+ / Flask). Generated by bootstrap 2026-11-09.
# Tools run from .venv via scripts/python (Windows Git Bash and Linux CI alike).
#
# Resource inventory (docs/testing.md, Resource hygiene):
#   ruff   — one process, no server or daemon. Leaves .ruff_cache (speed only).
#   pytest — one process, no xdist workers. Flask test client runs in-process: no server is
#            started, so nothing outlives the step. Leaves .pytest_cache (last-failed state).
#   data   — app data is in-memory; tests/conftest.py re-seeds it before every test (rule 5).
#
# Every step is [fast] today: the whole suite runs in seconds. When a step passes ~1 minute,
# split pytest by marker: fast `-m "not slow"`, full-only `-m slow` (Two speeds, rule 4).

# resource hygiene: no cache carried into the next run (rule 5)
lint [fast]: ./scripts/python -m ruff check --no-cache .
# resource hygiene: no cache carried into the next run (rule 5)
format [fast]: ./scripts/python -m ruff format --check --no-cache .
# resource hygiene: no cache carried into the next run (rule 5) — no last-failed state
test [fast]: ./scripts/python -m pytest -q -p no:cacheprovider
